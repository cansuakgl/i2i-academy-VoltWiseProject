spring:
  application:
    name: wattsmart-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wattsmart}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    default-schema: wattsmart
    schemas: wattsmart
    create-schemas: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: wattsmart
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:wattsmart-core}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.wattsmart.backend.*
        spring.json.use.type.headers: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  auth:
    session-ttl: ${AUTH_SESSION_TTL:P7D}
  live-state:
    store: ${LIVE_STATE_STORE:in-memory}
  ignite:
    enabled: ${IGNITE_ENABLED:false}
    host: ${IGNITE_HOST:localhost}
    port: ${IGNITE_PORT:10800}
    caches:
      live-home-state: ${IGNITE_LIVE_HOME_STATE_CACHE:live-home-state}
      idempotency: ${IGNITE_IDEMPOTENCY_CACHE:idempotency}
  idempotency:
    store: ${IDEMPOTENCY_STORE:in-memory}
    ttl: ${IDEMPOTENCY_TTL:PT24H}
  llm:
    enabled: ${LLM_ENABLED:true}
    language-code: ${LLM_LANGUAGE_CODE:tr}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      timeout: ${GEMINI_TIMEOUT:PT10S}
  email:
    provider: ${EMAIL_PROVIDER:logging}
    from: ${EMAIL_FROM:WattSmart <onboarding@resend.dev>}
    timeout: ${EMAIL_TIMEOUT:PT10S}
    dispatch:
      batch-size: ${EMAIL_DISPATCH_BATCH_SIZE:25}
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      home-registration: ${KAFKA_HOME_REGISTRATION_TOPIC:wattsmart.home-registration.v1}
      appliance-telemetry: ${KAFKA_APPLIANCE_TELEMETRY_TOPIC:wattsmart.appliance-telemetry.v1}
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:false}
  telemetry-ingestion:
    enabled: ${TELEMETRY_INGESTION_ENABLED:false}
  telemetry-simulator:
    enabled: ${TELEMETRY_SIMULATOR_ENABLED:false}
    fluctuation-percent: ${TELEMETRY_SIMULATOR_FLUCTUATION_PERCENT:15}
    anomaly-chance-percent: ${TELEMETRY_SIMULATOR_ANOMALY_CHANCE_PERCENT:10}
    publish-interval-ms: ${TELEMETRY_SIMULATOR_PUBLISH_INTERVAL_MS:5000}
  persistence:
    events-interval-ms: ${PERSISTENCE_EVENTS_INTERVAL_MS:60000}
    readings-interval-ms: ${PERSISTENCE_READINGS_INTERVAL_MS:1800000}
  jobs:
    enabled: ${SCHEDULED_DB_JOBS_ENABLED:true}
    dispatch-interval-ms: ${SCHEDULED_DB_JOBS_DISPATCH_INTERVAL_MS:60000}
